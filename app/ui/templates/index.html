<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutual fund facts</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eef2f7;
      color: #17212f;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(44rem, calc(100% - 2rem));
      margin: 3rem auto;
      padding: 2rem;
      background: #fff;
      border: 1px solid #dce3ec;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(23, 33, 47, .08);
    }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    .note {
      display: inline-block;
      margin: 0;
      padding: .35rem .7rem;
      border-radius: 999px;
      background: #fff4dd;
      color: #7a4b00;
      font-size: .9rem;
      font-weight: 700;
    }
    .label {
      display: block;
      margin: 1.5rem 0 .5rem;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #5c6b80;
    }
    .examples { display: flex; flex-wrap: wrap; gap: .5rem; }
    .example {
      padding: .55rem .9rem;
      border: 1px solid #c8d2e0;
      border-radius: 999px;
      background: #f8fafc;
      color: #24364f;
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
    }
    .example:hover:not(:disabled) { border-color: #2b6cb0; color: #2b6cb0; }
    form { display: flex; gap: .5rem; margin-top: .5rem; }
    input {
      flex: 1;
      min-width: 0;
      padding: .75rem .9rem;
      border: 1px solid #c8d2e0;
      border-radius: 8px;
      font: inherit;
    }
    input:focus, button:focus-visible { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .submit {
      padding: .75rem 1.25rem;
      border: 0;
      border-radius: 8px;
      background: #2b6cb0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .submit:hover:not(:disabled) { background: #245a92; }
    #response {
      margin-top: 1.5rem;
      padding: 1rem 1.1rem;
      border-left: 4px solid #2b6cb0;
      border-radius: 8px;
      background: #f0f7ff;
    }
    #answer { margin: 0; white-space: pre-line; }
    .source { margin: .85rem 0 0; font-size: .9rem; }
    #source { color: #2b6cb0; font-weight: 600; }
    #updated { margin: .5rem 0 0; color: #5c6b80; font-size: .85rem; }
    #error {
      margin: 1.25rem 0 0;
      padding: .8rem 1rem;
      border-radius: 8px;
      background: #fff0f0;
      color: #a12b2b;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Mutual fund facts for Aditya Birla Sun Life schemes.</h1>
    <p class="note">Facts-only. No investment advice.</p>

    <span class="label" id="examples-label">Try an example</span>
    <div class="examples" aria-labelledby="examples-label">
      {% for example in examples %}
      <button type="button" class="example">{{ example }}</button>
      {% endfor %}
    </div>

    <label class="label" for="question">Ask a question</label>
    <form id="ask-form">
      <input id="question" name="question" type="text" autocomplete="off" placeholder="Ask a fund fact" required>
      <button id="submit" class="submit" type="submit">Ask</button>
    </form>

    <section id="response" aria-live="polite" hidden>
      <p id="answer"></p>
      <p class="source" id="source-row"><span>Source:</span> <a id="source" href="#" target="_blank" rel="noopener noreferrer"></a></p>
      <p id="updated"></p>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>
  <script>
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');
    const submit = document.getElementById('submit');
    const examples = document.querySelectorAll('.example');
    const response = document.getElementById('response');
    const answerEl = document.getElementById('answer');
    const source = document.getElementById('source');
    const sourceRow = document.getElementById('source-row');
    const updated = document.getElementById('updated');
    const errorEl = document.getElementById('error');

    function setBusy(busy) {
      input.disabled = busy;
      submit.disabled = busy;
      examples.forEach((button) => { button.disabled = busy; });
    }

    async function ask(question) {
      const trimmed = question.trim();
      if (!trimmed) return;
      input.value = trimmed;
      errorEl.hidden = true;
      setBusy(true);
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: trimmed })
        });
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        const body = String(data.text || '').replace(/\n?Last updated from sources:[\s\S]*$/, '').trimEnd();
        const url = data.url || '';
        answerEl.textContent = body;
        source.textContent = url ? 'View source' : '';
        source.href = url;
        sourceRow.hidden = !url;
        updated.textContent = 'Last updated from sources: ' + (data.fetched_on || 'unknown');
        response.hidden = false;
      } catch (err) {
        response.hidden = true;
        errorEl.textContent = 'An answer could not be generated. Please try again.';
        errorEl.hidden = false;
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      ask(input.value);
    });

    examples.forEach((button) => {
      button.addEventListener('click', () => ask(button.textContent));
    });
  </script>
</body>
</html>
